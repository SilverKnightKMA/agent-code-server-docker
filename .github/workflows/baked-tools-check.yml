name: Baked Tools Check

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile*
      - scripts/**
      - managed-tools/baked-tools.json
      - bootstrap.sh
      - package.json
      - package-lock.json
      - bun.lock
      - go.mod
      - go.sum
      - tools.go
      - .github/workflows/baked-tools-check.yml
      - .tmux.conf
      - .github/workflows/baked-tools-monitor.yml
  workflow_dispatch:

jobs:
  check:
    name: Validate baked tools in image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #323: lockstep-heal needs contents:write to push the sync commit to the PR head
    permissions:
      contents: write
      checks: read

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v7
        with:
          path: builder
          fetch-depth: 1

      - name: Manifest <-> Dockerfile lockstep gate
        id: gate
        # #323: let the heal step run on mismatch; a hard-fail step would stop the job here.
        # The 'Fail if still red' step below re-asserts the red when healing is impossible.
        continue-on-error: true
        run: |
          python3 - << 'GATE'
          import json, re, sys
          df = open('builder/Dockerfile.dockerfile').read()
          manifest = {t['name']: t for t in
                      json.load(open('builder/managed-tools/baked-tools.json'))['tools']}
          pins = {
              'docker':      (r'FROM docker:([0-9][\w.]*)-dind', None),
              'dockerd':     (r'FROM docker:([0-9][\w.]*)-dind', None),
              'paseo':       (r'@getpaseo/cli@([0-9][\w.]*)', r'@getpaseo/server@([0-9][\w.]*)'),
              'paseo-relay': (r'ARG PASEO_RELAY_VERSION=([0-9][\w.]*)', None),
              'code-server': (r'ARG CODE_SERVER_VERSION=([0-9][\w.]*)', None),
          }
          failures = []
          for tool, (rx, rx2) in pins.items():
              if tool not in manifest:
                  failures.append(f'{tool}: present in Dockerfile pins but missing from baked-tools.json')
                  continue
              want = manifest[tool]['currentVersion']
              got = re.search(rx, df)
              if not got:
                  failures.append(f'{tool}: pin regex {rx!r} not found in Dockerfile')
                  continue
              if got.group(1) != want:
                  failures.append(f'{tool}: Dockerfile pin {got.group(1)} != baked-tools.json {want}')
              if rx2:
                  got2 = re.search(rx2, df)
                  if not got2:
                      failures.append(f'{tool}: secondary pin regex {rx2!r} not found')
                  elif got2.group(1) != want:
                      failures.append(f'{tool}: secondary Dockerfile pin {got2.group(1)} != baked-tools.json {want}')
          # every manifest entry pinned via FROM/ARG in the Dockerfile must be gated
          known = set(pins)
          for name in manifest:
              src = manifest[name].get('sourceDetail','')
              if 'FROM docker:' in src and name not in known:
                  failures.append(f'{name}: sourceDetail claims a docker FROM pin but lockstep gate has no regex')
          if failures:
              print('LOCKSTEP FAIL:')
              for f in failures: print(' -', f)
              sys.exit(1)
          print('Lockstep OK: all Dockerfile pins match baked-tools.json')
          GATE

      # #323 lockstep-heal: when the ONLY failures are 'Dockerfile pin X != baked-tools.json Y'
      # (Dockerfile leads — dependabot FROM bumps, manual @getpaseo bumps) and the PR did
      # NOT hand-edit baked-tools.json, sync baked-tools.json to the Dockerfile pins and
      # push to the PR head. This run then fails intentionally ('HEALED — rerun verifies');
      # the pushed commit re-triggers the checks and auto-merge proceeds on the new SHA.
      # Never heals the reverse direction (baked-tools.json leading) — that needs a human.
      - name: Checkout PR head (for heal)
        id: healsrc
        if: steps.gate.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: healsrc
          fetch-depth: 1

      - name: Heal lockstep drift (Dockerfile pin leads)
        id: heal
        if: steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ] \
             || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "not healable (fork PR or non-PR context) — leaving red for a human"
            exit 0
          fi
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' 2>/dev/null | grep -qx 'managed-tools/baked-tools.json'; then
            echo "PR touches baked-tools.json — heal disabled (human edit in flight)"
            exit 0
          fi
          cd healsrc
          set +e
          python3 - <<'HEAL'
          import json, re, sys
          df = open('Dockerfile.dockerfile').read()
          path = 'managed-tools/baked-tools.json'
          data = json.load(open(path))
          manifest = {t['name']: t for t in data['tools']}
          pins = {
              'docker':      (r'FROM docker:([0-9][\w.]*)-dind', None),
              'dockerd':     (r'FROM docker:([0-9][\w.]*)-dind', None),
              'paseo':       (r'@getpaseo/cli@([0-9][\w.]*)', r'@getpaseo/server@([0-9][\w.]*)'),
              'paseo-relay': (r'ARG PASEO_RELAY_VERSION=([0-9][\w.]*)', None),
              'code-server': (r'ARG CODE_SERVER_VERSION=([0-9][\w.]*)', None),
          }
          mismatch = re.compile(r'^(\S+): (?:secondary )?Dockerfile pin ([0-9][\w.]*) != baked-tools\.json ([0-9][\w.]*)$')
          healed = []
          only_mismatches = True
          # recompute failures exactly like the gate, but capture them for classification
          for tool, (rx, rx2) in pins.items():
              if tool not in manifest:
                  only_mismatches = False; continue
              want = manifest[tool]['currentVersion']
              got = re.search(rx, df)
              if not got:
                  only_mismatches = False; continue
              if got.group(1) != want:
                  healed.append((tool, got.group(1), want))
              if rx2:
                  got2 = re.search(rx2, df)
                  if got2 and got2.group(1) != want:
                      pass  # same tool, already captured above
          if not only_mismatches or not healed:
              print('no healable drift (non-mismatch failures or clean) — leaving red')
              sys.exit(1)
          for tool, new, old in healed:
              manifest[tool]['currentVersion'] = new
              print(f'healed {tool}: {old} -> {new} (Dockerfile leads)')
          json.dump(data, open(path, 'w'), indent=2)
          open(path, 'a').write('\n')
          sys.exit(42)
          HEAL
          rc=$?
          set -e
          if [ "$rc" -ne 42 ]; then
            echo "heal: nothing pushed (rc=$rc)"
            exit 0
          fi
          git config user.name "lockstep-heal[bot]"
          git config user.email "action@github.com"
          git add managed-tools/baked-tools.json
          git commit -q -m "chore(baked-tools): lockstep heal — sync baked-tools.json to Dockerfile pins (automated, #323)"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "HEALED — sync commit pushed; this run fails intentionally so nothing merges on the pre-heal SHA."
          exit 1

      - name: Fail if still red and not healed
        if: steps.gate.outcome == 'failure' && steps.heal.outputs.pushed != 'true'
        run: |
          echo "Lockstep gate failed and healing did not apply — see gate output above."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: builder
          file: builder/Dockerfile.dockerfile
          tags: agent-code-server:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify baked commands exist
        run: |
          failures=0
          for cmd in code-server node npm docker dockerd fixuid gosu dumb-init git curl jq python3 pip tmux paseo paseo-relay; do
            result=$(docker run --rm --entrypoint /bin/bash agent-code-server:test -c "command -v ${cmd}" 2>&1) || true
            if [ -n "${result}" ]; then
              echo "OK: ${cmd} found at ${result}"
            else
              echo "FAIL: ${cmd} not found"
              docker run --rm --entrypoint /bin/bash agent-code-server:test -c "which ${cmd} 2>&1 || echo 'not found'" 2>&1 || true
              failures=$((failures + 1))
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} command(s) missing from image"
            exit 1
          fi
          echo "OK: all baked commands found"

      - name: Verify baked tool versions
        run: |
          failures=0
          for cmd in code-server node npm docker dockerd git python3 tmux paseo paseo-relay; do
            echo "=== ${cmd} --version ==="
            version=$(docker run --rm --entrypoint /bin/bash agent-code-server:test -c "if [ \"${cmd}\" = tmux ]; then tmux -V; else ${cmd} --version; fi 2>&1" || echo "VERSION CHECK FAILED")
            echo "${version}"
            if echo "${version}" | grep -q "VERSION CHECK FAILED"; then
              echo "FAIL: ${cmd} --version failed"
              failures=$((failures + 1))
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} version check(s) failed"
            exit 1
          fi
          echo "OK: all version checks passed"

      - name: Verify agent CLIs are not baked into image
        run: |
          failures=0
          for cmd in omp pi opencode claude codex droid copilot; do
            if docker run --rm --entrypoint /bin/bash agent-code-server:test -c "command -v ${cmd} >/dev/null 2>&1"; then
              echo "FAIL: ${cmd} is still baked into the image (must stay Tier 2 managed-mounted)"
              failures=$((failures + 1))
            else
              echo "OK: ${cmd} is not baked into the image"
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} agent CLI(s) incorrectly baked into the image"
            exit 1
          fi

      - name: Verify PATH in fresh shell
        run: |
          expected_paths="/home/coder/.bun/bin /home/coder/.npm-global/bin /home/coder/.local/bin /home/coder/.local/go/bin /home/coder/.go/bin /home/coder/.cargo/bin /home/coder/.local/pip/bin"

          shell_path=$(docker run --rm --entrypoint /bin/bash agent-code-server:test -i -c 'echo "$PATH"' 2>&1)
          echo "Fresh shell PATH: ${shell_path}"

          failures=0
          for dir in ${expected_paths}; do
            if echo "${shell_path}" | tr ':' '\n' | grep -qFx "${dir}"; then
              echo "OK: PATH contains ${dir}"
            else
              echo "FAIL: PATH missing ${dir}"
              failures=$((failures + 1))
            fi
          done

          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} path(s) missing from fresh shell PATH"
            exit 1
          fi
          echo "OK: all managed directories in fresh shell PATH"

      - name: Verify coder fresh shell (simulates real terminal)
        run: |
          echo "=== Coder shell: id / HOME / PATH / bun / node / npm / tmux ==="
          failures=0
          result=$(docker run --rm --entrypoint /bin/bash agent-code-server:test -c '
            gosu coder bash -ilc '\''
              echo "ID: $(id)"
              echo "HOME: ${HOME}"
              echo "PATH: ${PATH}"
              echo "---"
              for cmd in node npm tmux; do
                loc=$(command -v "${cmd}" 2>&1) || loc="NOT_FOUND"
                echo "command -v ${cmd}: ${loc}"
                ver=$(if [ "${cmd}" = tmux ]; then tmux -V 2>&1; else "${cmd}" --version 2>&1; fi) || ver="FAILED($?)"
                echo "${cmd} --version: ${ver}"
                echo "---"
              done
              # bun is Tier 2 (managed release binary), not baked: report only
              loc=$(command -v bun 2>&1) || loc="NOT_FOUND (expected: managed tool)"
              echo "command -v bun: ${loc}"
            '\'' 2>&1
          ')
          echo "${result}"

          # Check user info
          if ! echo "${result}" | grep -q "uid=1000(coder)"; then
            echo "FAIL: expected user coder (uid=1000)"
            failures=$((failures + 1))
          fi
          if ! echo "${result}" | grep -q "HOME: /home/coder"; then
            echo "FAIL: expected HOME=/home/coder"
            failures=$((failures + 1))
          fi

          # Check PATH entries
          for dir in \
            /home/coder/.bun/bin \
            /home/coder/.npm-global/bin \
            /home/coder/.local/bin \
            /home/coder/.local/go/bin \
            /home/coder/.go/bin \
            /home/coder/.cargo/bin \
            /home/coder/.local/pip/bin
          do
            if echo "${result}" | grep -qE "PATH:.*${dir}(:|$)"; then
              echo "OK: PATH contains ${dir}"
            else
              echo "FAIL: PATH missing ${dir}"
              failures=$((failures + 1))
            fi
          done

          # Check commands found (bun is Tier 2 managed, not baked — see note above)
          for cmd in node npm tmux; do
            loc=$(echo "${result}" | grep -E "^command -v ${cmd}:" | head -1)
            if echo "${loc}" | grep -qv "NOT_FOUND"; then
              echo "OK: ${cmd} found in coder shell"
            else
              echo "FAIL: ${cmd} not found in coder shell"
              failures=$((failures + 1))
            fi
          done

          # Check the shell itself does not leak missing-interpreter noise
          # (historically: "env: bun: No such file or directory" when omp's
          # bun runtime was baked; bun is managed now, so only guard generic
          # interpreter errors, not bun specifically)
          if echo "${result}" | grep -qi "No such file or directory"; then
            echo "FAIL: missing-file errors detected in coder shell output"
            failures=$((failures + 1))
          fi

          if [ "${failures}" -gt 0 ]; then
            echo "FAIL: ${failures} coder shell check(s) failed"
            exit 1
          fi
          echo "OK: coder fresh shell validates"

      - name: Verify entrypoint does not exit immediately (no volumes)
        run: |
          echo "=== Entrypoint startup check ==="
          container_id=$(docker run -d --rm agent-code-server:test 2>&1) || {
            echo "Container failed to start (expected without volumes)"
            echo "OK: quick-start not required"
            exit 0
          }
          sleep 5
          status=$(docker inspect --format '{{.State.Status}}' "${container_id}" 2>/dev/null || echo "gone")
          docker logs "${container_id}" 2>&1 | tail -5 || true
          docker stop "${container_id}" 2>/dev/null || true
          echo "Container status after 5s: ${status}"
          if [ "${status}" = "running" ]; then
            echo "OK: container starts without volumes"
          else
            echo "Container exits without volumes (expected — entrypoint needs /home/coder)"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Baked Tools Check" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Image: agent-code-server:test" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          docker images --filter=reference='agent-code-server:test' --format '{{.CreatedAt}}' | head -1 | while read -r created; do
            echo "Built: ${created}" >> "${GITHUB_STEP_SUMMARY}"
          done
